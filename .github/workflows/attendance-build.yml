name: 출석부 윈도우 빌드

on:
  push:
    tags: ['attendance-v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Release로 게시 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

defaults:
  run:
    working-directory: attendance

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: attendance/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
      - name: E2E (Electron, xvfb)
        run: xvfb-run -a npm run test:e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: attendance/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Build installer + portable
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: List artifacts
        shell: bash
        run: ls -la dist | grep -E '\.exe$' || ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: 출석부-windows
          path: |
            attendance/dist/*.exe
          if-no-files-found: error
      - name: Release (태그 푸시 또는 release=true)
        if: startsWith(github.ref, 'refs/tags/attendance-v') || github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('attendance-build-{0}', github.run_number) }}
          name: 출석부 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          files: attendance/dist/*.exe
          body: |
            윈도우용 출석부 앱입니다.
            - `출석부-설치-*.exe`: 설치형 (시작 메뉴·바탕화면 아이콘 등록)
            - `출석부-무설치-*.exe`: 무설치형 (복사해서 바로 실행)

            처음 실행 시 "Windows의 PC 보호" 창이 뜨면 "추가 정보 → 실행"을 누르세요.
            데이터는 `문서\출석부` 폴더에 저장되며, 프로그램을 바꿔도 유지됩니다.
