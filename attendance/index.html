<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출석 확인</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1c2230; --muted: #6b7280; --line: #e2e5ea; --soft: #eef1f5;
    --accent: #2f6fed; --accent-soft: #e6eefd;
    --absent: #d64545; --absent-soft: #fdecec;
    --pending: #c77c00; --pending-soft: #fff4de;
    --excused: #1f8a5b; --excused-soft: #e3f5ec;
    --live: #e0413a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13151a; --card: #1c1f26; --text: #e6e8ec; --muted: #9aa1ad; --line: #2d313a; --soft: #252932;
      --accent: #5b8ff5; --accent-soft: #1f2a42;
      --absent: #ef6b6b; --absent-soft: #3a2224;
      --pending: #f0a92a; --pending-soft: #3a2f1a;
      --excused: #3cc07a; --excused-soft: #1a3328;
      --live: #ff5c55;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         background: var(--bg); color: var(--text); font-size: 15px; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* 상단 */
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 16px; position: sticky; top: 0; z-index: 5; }
  .top { display: flex; align-items: center; gap: 12px; max-width: 1100px; margin: 0 auto; flex-wrap: wrap; }
  .top h1 { font-size: 18px; margin: 0; }
  .datenav { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .datenav button { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; }
  .datenav .today-btn { font-size: 13px; }
  .datenav .date { font-weight: 700; min-width: 132px; text-align: center; font-variant-numeric: tabular-nums; }
  .clock { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .menu-btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; }
  .datenav[hidden] + .menu-btn { margin-left: auto; }
  .tabs { display: flex; gap: 4px; background: var(--soft); border-radius: 10px; padding: 3px; }
  .tabs button { border: 0; background: transparent; border-radius: 8px; padding: 6px 12px; font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .tabs button.active { background: var(--card); color: var(--text); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .pill { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; background: var(--pending); color: #fff; }

  /* 인정결석 공문 관리 */
  .docs { max-width: 760px; width: 100%; margin: 0 auto; display: grid; gap: 12px; }
  .subtabs { display: flex; gap: 6px; }
  .subtabs button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
  .subtabs button.active { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .doc-group { padding: 0; overflow: hidden; }
  .doc-head { padding: 14px 16px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .doc-head b { font-size: 16px; }
  .doc-head .sub { color: var(--muted); font-size: 13px; }
  .doc-head .course { margin-left: auto; font-size: 13px; font-weight: 600; }
  .doc-rows { list-style: none; margin: 0; padding: 4px 16px; }
  .doc-rows li { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); flex-wrap: wrap; font-size: 14px; }
  .doc-rows li:first-child { border-top: 0; }
  .doc-rows label { display: flex; gap: 10px; align-items: center; flex: 1 1 200px; cursor: pointer; }
  .doc-rows input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  .doc-rows .when { font-variant-numeric: tabular-nums; }
  .doc-rows .elapsed { font-size: 12px; color: var(--pending); font-weight: 600; }
  .doc-rows .info { font-size: 12px; color: var(--muted); flex: 1 1 200px; }
  .link-btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 4px 10px; font-size: 13px; color: var(--muted); }
  .doc-foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 16px; background: var(--soft); }
  .doc-foot label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .doc-foot input { font: inherit; font-size: 14px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .doc-foot input.memo { flex: 1 1 180px; }
  .doc-foot .primary { padding: 8px 14px; margin-left: auto; }
  .sess-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 16px; background: var(--soft); }
  .sess-tools input { font: inherit; font-size: 14px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .sess-tools input[type=number] { width: 64px; }
  .sess-tools .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  .sess-tools button { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; font-size: 14px; }
  .sess-tools button.primary { border: 0; background: var(--accent); color: #fff; font-weight: 700; }
  .sess-tools button:disabled { opacity: .5; cursor: default; }
  .tt { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .tt-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; }
  .tt-head .sub { font-size: 13px; color: var(--muted); }
  .tt-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .tt-list li { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  @media (max-width: 520px) {
    .tt-list li { display: grid; grid-template-columns: auto auto 1fr; grid-template-areas: "d p del" "s s s"; padding: 8px 0; border-top: 1px solid var(--line); }
    .tt-list li:first-child { border-top: 0; }
    .tt-list [data-f=d] { grid-area: d; } .tt-list label { grid-area: p; } .tt-list [data-act=tt-del] { grid-area: del; justify-self: end; }
    .tt-list .tt-time { grid-area: s; }
  }
  .tt-time { display: flex; gap: 6px; align-items: center; }
  .tt-list select, .tt-list input { font: inherit; font-size: 14px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px; }
  .tt-list input[type=number] { width: 48px; margin-right: 2px; }
  .tt-list label { display: flex; align-items: center; color: var(--muted); }
  .tt-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .sess-list { list-style: none; margin: 0; padding: 4px 16px 12px; }
  .sess-list li { display: grid; grid-template-columns: 56px 150px 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .sess-list li:first-child { border-top: 0; }
  .sess-list li.past { color: var(--muted); }
  .sess-list li.today { background: var(--accent-soft); border-radius: 8px; }
  .sess-list li.page-break { border-top: 2px dashed var(--line); }
  .sess-list .no { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; padding-right: 4px; white-space: nowrap; }
  .sess-list input[type=date] { font: inherit; font-size: 14px; color: inherit; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 3px 4px; width: 100%; }
  .sess-list input[type=date]:hover, .sess-list input[type=date]:focus { border-color: var(--line); background: var(--card); }
  .sess-list .desc { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .sess-list .warn { color: var(--absent); font-weight: 600; }
  @media (max-width: 520px) {
    .sess-list li { grid-template-columns: 52px 1fr auto; }
    .sess-list .no { font-size: 13px; }
    .sess-list .desc { grid-column: 2 / 3; }
  }
  .student .who .doc-info { display: block; font-size: 12px; color: var(--excused); }
  .student .who .doc-info.pending { color: var(--pending); }

  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  @media (min-width: 860px) { main.has-data { grid-template-columns: 340px 1fr; align-items: start; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .section-title { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 8px 4px; }

  /* 오늘 수업 목록 */
  .classes { display: grid; gap: 8px; }
  .class-card { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
                display: grid; grid-template-columns: 64px 1fr; gap: 4px 12px; width: 100%; }
  .class-card:hover { border-color: var(--accent); }
  .class-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .class-card.done { opacity: .72; }
  .class-card .time { grid-row: span 2; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); line-height: 1.35; }
  .class-card .time b { display: block; font-size: 16px; color: var(--text); }
  .class-card .name { font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .class-card .meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; }
  .tag.live { background: var(--live); color: #fff; }
  .tag.next { background: var(--accent-soft); color: var(--accent); }
  .tag.done { background: var(--soft); color: var(--muted); }
  .tag.notime { background: var(--soft); color: var(--muted); }
  .mini { font-weight: 600; }
  .mini.absent { color: var(--absent); } .mini.pending { color: var(--pending); } .mini.excused { color: var(--excused); }

  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
  .empty b { color: var(--text); display: block; margin-bottom: 6px; font-size: 16px; }

  /* 명단 */
  .roster-head { padding: 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .roster-head h2 { margin: 0 0 4px; font-size: 18px; }
  .roster-head .sub { color: var(--muted); font-size: 13px; }
  .back { display: none; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; }
  .counts { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .count { font-size: 13px; border-radius: 8px; padding: 4px 10px; background: var(--soft); }
  .count b { font-variant-numeric: tabular-nums; }
  .count.absent { background: var(--absent-soft); color: var(--absent); }
  .count.pending { background: var(--pending-soft); color: var(--pending); }
  .count.excused { background: var(--excused-soft); color: var(--excused); }
  .notice { margin: 12px 16px 0; font-size: 13px; background: var(--soft); border-radius: 10px; padding: 10px 12px; white-space: pre-line; color: var(--muted); }
  .notice summary { cursor: pointer; font-weight: 600; color: var(--text); }
  .hint { font-size: 13px; color: var(--muted); padding: 12px 16px 0; margin: 0; }

  .students { list-style: none; margin: 0; padding: 8px 16px 16px; }
  .student { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .student:first-child { border-top: 0; }
  .student .no { width: 22px; text-align: right; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .student .who { flex: 1 1 140px; min-width: 0; }
  .student .who b { display: block; }
  .student .who span { font-size: 12px; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; border-left: 1px solid var(--line); background: transparent; padding: 7px 10px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .seg button:first-child { border-left: 0; }
  .seg button.on[data-s="present"] { background: var(--soft); color: var(--text); font-weight: 700; }
  .seg button.on[data-s="absent"]  { background: var(--absent);  color: #fff; font-weight: 700; }
  .seg button.on[data-s="pending"] { background: var(--pending); color: #fff; font-weight: 700; }
  .seg button.on[data-s="excused"] { background: var(--excused); color: #fff; font-weight: 700; }
  .student.marked { background: linear-gradient(90deg, var(--soft), transparent 60%); }

  @media (max-width: 859px) {
    main.has-data.show-roster .left { display: none; }
    main.has-data:not(.show-roster) .right { display: none; }
    .back { display: inline-block; }
  }
  @media (max-width: 520px) {
    .seg { width: 100%; }
    .seg button { flex: 1; padding: 8px 4px; font-size: 12px; }
    .student .no { display: none; }
  }

  /* 시작 화면 / 메뉴 */
  .welcome { max-width: 520px; margin: 40px auto; padding: 28px; text-align: center; }
  .welcome h2 { margin: 0 0 8px; }
  .welcome p { color: var(--muted); margin: 0 0 20px; line-height: 1.6; }
  .primary { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 700; }
  .menu { position: absolute; right: 16px; top: 56px; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 6px; display: none; min-width: 220px; z-index: 10; }
  .menu.open { display: block; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 8px; }
  .menu button:hover { background: var(--soft); }
  .menu .danger { color: var(--absent); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg);
           padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>출석 확인</h1>
    <span class="clock" id="clock"></span>
    <nav class="tabs" id="tabs" hidden>
      <button data-view="classes" class="active">수업</button>
      <button data-view="docs">인정결석 공문 <span class="pill" id="pendingPill" hidden></span></button>
      <button data-view="sessions">차시 관리</button>
    </nav>
    <div class="datenav" id="datenav" hidden>
      <button id="prevDay" aria-label="이전 날">‹</button>
      <span class="date" id="dateLabel"></span>
      <button id="nextDay" aria-label="다음 날">›</button>
      <button class="today-btn" id="todayBtn">오늘</button>
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="메뉴">☰</button>
  </div>
  <div class="menu" id="menu">
    <button id="menuExport">출석부 엑셀 내보내기</button>
    <button id="menuImport">출석부 엑셀 가져오기</button>
    <button id="menuTemplate">내보내기 양식 파일 바꾸기</button>
    <button class="danger" id="menuReset">모든 데이터 지우기</button>
  </div>
  <input type="file" id="fileInput" accept=".xlsx,.xls" hidden>
  <input type="file" id="templateInput" accept=".xlsx" hidden>
</header>

<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   시간표 (2026학년도 2학기 PDF 기준)
   key: 출석부 엑셀의 시트 이름. d: 요일(1=월 … 5=금), p: 교시
   ========================================================= */
const TIMETABLE = {
  '경제':     [{ d: 4, p: 2, s: '10:00', e: '10:50' }, { d: 4, p: 3, s: '11:00', e: '11:50' }],
  '심리학':   [{ d: 3, p: 5, s: '13:30', e: '14:20' }],
  '기후변화': [{ d: 1, p: 8, s: '16:40', e: '17:30' }, { d: 2, p: 8, s: '16:40', e: '17:30' }, { d: 3, p: 8, s: '16:40', e: '17:30' }],
  '금융경제': [{ d: 4, p: 8, s: '16:35', e: '17:25' }, { d: 4, p: 9, s: '17:25', e: '18:15' }, { d: 5, p: 8, s: '16:40', e: '17:30' }],
};

const STATUSES = [
  { key: 'present', label: '출석' },
  { key: 'absent',  label: '결석' },
  { key: 'pending', label: '인정결석(대기)' },
  { key: 'excused', label: '인정결석(확정)' },
];
const SHORT = { absent: '결석', pending: '인정대기', excused: '인정확정' };
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
const STORE_KEY = 'attendance-v2';
const FIRST_COL = 5, PER_PAGE = 17;   // 출석부 양식: F열부터 한 페이지에 17차시
/* 공휴일 (시간표대로 차시를 자동 추가할 때 건너뜀). 학교 행사일은 추가 후 직접 삭제 */
const HOLIDAYS = {
  '2026-09-24': '추석', '2026-09-25': '추석', '2026-09-26': '추석', '2026-10-03': '개천절', '2026-10-05': '대체공휴일',
  '2026-10-09': '한글날', '2026-12-25': '성탄절',
  '2027-01-01': '신정', '2027-02-06': '설날', '2027-02-07': '설날', '2027-02-08': '설날', '2027-02-09': '대체공휴일',
};
const TEMPLATE_KEY = 'attendance-template';

/* data = {
     importedAt, fileName,
     courses: [{ id, title, credits, teacher, note, students: [{ id, seq, school, sid, name }], sessions: [{ no, date }] }],
     marks: { "courseId|sessionNo|studentId": "absent" | "pending" | "excused" },  // 없으면 출석
     docs:  { "courseId|sessionNo|studentId": { received: 'YYYY-MM-DD' | null, memo } }  // 인정결석 확정 시 공문 정보
   } */
let data = load();
let viewDate;             // 'YYYY-MM-DD' (유틸 정의 뒤에 초기화)
let selectedKey = null;   // "courseId|sessionNo"
let view = 'classes';     // 'classes' | 'docs'
let docsTab = 'pending';  // 'pending' | 'excused'
let sessCourse = null;    // 차시 관리에서 고른 과목 id
let sessScroll = false;
if (data) data.docs = data.docs || {};

function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return null;
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
  catch (e) { toast('저장에 실패했습니다.'); }
}

/* ---------- 유틸 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
function todayStr(d = new Date()) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return todayStr(d); }
function fmtDate(s) { const d = parseDate(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEK[d.getDay()]})`; }
function nowMinutes() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function toMin(hm) { if (!hm) return 9999; const [h, m] = hm.split(':').map(Number); return h * 60 + m; }

/* 과목 시간표: 앱에서 입력한 값(data.timetable)이 있으면 그것을, 없으면 코드의 기본 시간표를 쓴다.
   slot = { d: 요일(1=월), p: 교시(없으면 null), s: 시작 'HH:MM'(없으면 ''), e: 종료 } */
function getSlots(cid) { return (data && data.timetable && data.timetable[cid]) || TIMETABLE[cid] || []; }
function slotLabel(slot) {
  if (!slot) return '';
  return [slot.p ? slot.p + '교시' : '', slot.s ? `${slot.s}~${slot.e}` : '시간 미정'].filter(Boolean).join(' ');
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ---------- 해당 날짜의 수업 계산 ----------
   출석부 엑셀의 차시 날짜를 기준으로, 같은 날 k번째 차시에 시간표의 k번째 시간을 붙인다. */
function classesOn(date) {
  if (!data) return [];
  const dow = parseDate(date).getDay();
  const list = [];
  for (const c of data.courses) {
    const todays = c.sessions.filter(s => s.date === date);
    const slots = getSlots(c.id).filter(t => t.d === dow).sort((a, b) => toMin(a.s) - toMin(b.s) || (a.p || 0) - (b.p || 0));
    todays.forEach((s, i) => list.push({ course: c, session: s, slot: slots[i] || null }));
  }
  return list.sort((a, b) => (a.slot ? toMin(a.slot.s) : 9999) - (b.slot ? toMin(b.slot.s) : 9999));
}

function stateOf(item, date) {
  if (!item.slot || !item.slot.s) return 'notime';
  const today = todayStr();
  if (date < today) return 'done';
  if (date > today) return 'next';
  const n = nowMinutes();
  if (n < toMin(item.slot.s)) return 'next';
  if (n <= toMin(item.slot.e)) return 'live';
  return 'done';
}

function markOf(courseId, no, studentId) { return data.marks[`${courseId}|${no}|${studentId}`] || 'present'; }
function setMark(courseId, no, studentId, status) {
  const key = `${courseId}|${no}|${studentId}`;
  if (status === 'present') delete data.marks[key]; else data.marks[key] = status;
  if (status === 'excused') data.docs[key] = data.docs[key] || { received: todayStr(), memo: '' };
  else delete data.docs[key];
  save();
}
function tally(course, no) {
  const t = { absent: 0, pending: 0, excused: 0 };
  course.students.forEach(st => { const m = markOf(course.id, no, st.id); if (m !== 'present') t[m]++; });
  return t;
}

/* 날짜 이동 시 가장 가까운 수업일 찾기 */
function nearestClassDate(from, dir) {
  const dates = [...new Set(data.courses.flatMap(c => c.sessions.map(s => s.date)))].sort();
  return dir > 0 ? dates.find(d => d > from) : [...dates].reverse().find(d => d < from);
}

    <div class="right" id="roster"></div>`;

  const listEl = $('classList');

    if (next) $('gotoNext').onclick = e => { e.preventDefault(); viewDate = next; render(); };
    $('roster').innerHTML = '';
    main.classList.remove('show-roster');

  }

  listEl.innerHTML = items.map(item => {
    const st = stateOf(item, viewDate);
    const t = tally(item.course, item.session.no);
    const tag = { live: '<span class="tag live">진행 중</span>', next: viewDate === todayStr() ? '<span class="tag next">예정</span>' : '',
                  done: '', notime: '<span class="tag notime">시간 미정</span>' }[st];
    const marks = ['absent', 'pending', 'excused'].filter(k => t[k]).map(k => `<span class="mini ${k}">${SHORT[k]} ${t[k]}</span>`).join('');
    return `<button class="class-card ${st === 'done' ? 'done' : ''} ${key(item) === selectedKey ? 'selected' : ''}" data-key="${key(item)}">
      <span class="time">${item.slot?.s ? `<b>${item.slot.s}</b>~${item.slot.e}` : '<b>--:--</b>'}${item.slot?.p ? `<br>${item.slot.p}교시` : ''}</span>
      <span class="name">${esc(item.course.title)} ${tag}</span>
      <span class="meta"><span>${item.session.no}차시</span><span>수강생 ${item.course.students.length}명</span>${marks || '<span>전원 출석</span>'}</span>
    </button>`;
  }).join('');

  listEl.querySelectorAll('.class-card').forEach(b => b.onclick = () => {
    selectedKey = b.dataset.key;

function key(item) { return `${item.course.id}|${item.session.no}`; }
function defaultSelection(items) {
  if (!items.length) return null;
  const pick = items.find(i => stateOf(i, viewDate) === 'live')
            || items.find(i => stateOf(i, viewDate) === 'next')
            || items[items.length - 1];
  return key(pick);

function renderPendingBadge() {
  const n = data ? Object.values(data.marks).filter(v => v === 'pending').length : 0;
  $('pendingPill').hidden = !n;
  $('pendingPill').textContent = n;
}

function docInfoLine(k, m) {
  if (m === 'pending') return '<span class="doc-info pending">공문 접수 대기 중</span>';
  if (m !== 'excused') return '';
  const d = data.docs[k];
  if (!d) return '';
  return `<span class="doc-info">${d.received ? '공문 ' + shortDate(d.received) + ' 접수' : '공문 접수(날짜 미기록)'}${d.memo ? ' · ' + esc(d.memo) : ''}</span>`;
}
function shortDate(s) { const d = parseDate(s); return `${d.getMonth() + 1}/${d.getDate()}`; }

/* ---------- 차시 관리 ---------- */
// 같은 날 k번째 차시 → 그 요일 시간표의 k번째 시간
function slotsOn(course, date) {
  const dow = parseDate(date).getDay();
  return getSlots(course.id).filter(t => t.d === dow).sort((a, b) => toMin(a.s) - toMin(b.s) || (a.p || 0) - (b.p || 0));
}
function slotFor(course, session) {
  const idx = course.sessions.filter(s => s.date === session.date && s.no < session.no).length;
  return slotsOn(course, session.date)[idx] || null;
}

/* 차시 목록을 다시 매긴다. list: [{ date, old }] (old = 기존 차시 번호, 새 차시는 null).
   날짜순으로 정렬하고 차시 번호가 바뀐 만큼 출결·공문 기록도 옮긴다. */
function rebuildSessions(course, list) {
  const sorted = list.map((x, i) => ({ ...x, i })).sort((a, b) => a.date.localeCompare(b.date) || a.i - b.i);
  const map = {};
  sorted.forEach((x, i) => { if (x.old != null) map[x.old] = i + 1; });
  for (const store of [data.marks, data.docs]) {
    const moved = {};
    for (const k of Object.keys(store)) {
      const { cid, no, sid } = splitKey(k);
      if (cid !== course.id) continue;
      if (map[no]) moved[`${cid}|${map[no]}|${sid}`] = store[k];
      delete store[k];
    }
    Object.assign(store, moved);
  }
  course.sessions = sorted.map((x, i) => ({ no: i + 1, date: x.date }));
  save();
}
const currentList = course => course.sessions.map(s => ({ date: s.date, old: s.no }));

function autoDates(course, count) {
  const out = [];
  const last = course.sessions.at(-1)?.date;
  let d = last ? addDays(last, 1) : todayStr();
  for (let guard = 0; out.length < count && guard < 400; guard++, d = addDays(d, 1)) {
    if (HOLIDAYS[d]) continue;
    for (const _ of slotsOn(course, d)) if (out.length < count) out.push(d);
  }
  return out;
}

function renderSessions() {
  const main = $('main');
  main.className = '';
  if (!data.courses.some(c => c.id === sessCourse)) sessCourse = data.courses[0]?.id;
  const course = data.courses.find(c => c.id === sessCourse);
  const today = todayStr();
  const slots = getSlots(course.id);
  const perWeek = slots.length;
  const custom = !!data.timetable?.[course.id];
  const cap = course.capacity || null;
  const marksOf = no => {
    const t = tally(course, no);
    return ['absent', 'pending', 'excused'].filter(k => t[k]).map(k => `<span class="mini ${k}">${SHORT[k]} ${t[k]}</span>`).join('');
  };

  main.innerHTML = `<div class="docs">
    <div class="subtabs" style="flex-wrap:wrap">
      ${data.courses.map(c => `<button data-cid="${esc(c.id)}" class="${c.id === course.id ? 'active' : ''}">${esc(c.title)}</button>`).join('')}
    </div>
    <div class="card doc-group">
      <div class="doc-head">
        <b>${esc(course.title)}</b>
        <span class="sub">총 ${course.sessions.length}차시${cap ? ` · 출석부 양식 ${cap}칸` : ''}${perWeek ? ` · 주 ${perWeek}차시` : ' · 시간표 없음'}</span>
      </div>
      <div class="tt">
        <div class="tt-head"><b>수업 시간표</b>
          <span class="sub">${custom ? '직접 입력한 시간표' : TIMETABLE[course.id] ? '기본 시간표 (PDF)' : '시간표 없음'}</span></div>
        <ul class="tt-list">
          ${slots.map((t, i) => `<li data-i="${i}">
            <select data-f="d" aria-label="요일">${[1, 2, 3, 4, 5, 6].map(d => `<option value="${d}" ${t.d === d ? 'selected' : ''}>${WEEK[d]}요일</option>`).join('')}</select>
            <label><input type="number" data-f="p" min="1" max="12" value="${t.p || ''}" placeholder="-">교시</label>
            <span class="tt-time"><input type="time" data-f="s" value="${t.s || ''}" aria-label="시작 시간">
            <span>~</span>
            <input type="time" data-f="e" value="${t.e || ''}" aria-label="종료 시간"></span>
            <button class="link-btn" data-act="tt-del">삭제</button>
          </li>`).join('')}
        </ul>
        <div class="tt-actions">
          <button class="link-btn" id="ttAdd">+ 시간 추가</button>
          ${course.sessions.length ? '<button class="link-btn" id="ttGuess">기존 차시 날짜로 요일 채우기</button>' : ''}
          ${custom && TIMETABLE[course.id] ? '<button class="link-btn" id="ttReset">기본 시간표로 되돌리기</button>' : ''}
        </div>
      </div>
      <div class="sess-tools">
        <input type="number" id="autoCount" min="1" max="60" value="${perWeek || 1}" ${perWeek ? '' : 'disabled'}>
        <button class="primary" id="autoAdd" ${perWeek ? '' : 'disabled'}>시간표대로 차시 추가</button>
        <span class="sep"></span>
        <input type="date" id="manualDate" value="${today}">
        <button id="manualAdd">이 날짜로 1차시 추가</button>
      </div>
      <p class="hint" style="padding-bottom:4px">공휴일은 자동으로 건너뜁니다. 학교 행사 등으로 수업이 없는 날은 삭제하세요. 날짜를 고치면 차시 순서가 날짜순으로 다시 매겨집니다.</p>
      ${course.sessions.length ? '' : '<div class="empty">등록된 차시가 없습니다.</div>'}
      <ul class="sess-list">
        ${course.sessions.map(s => {
          const slot = slotFor(course, s);
          const cls = [s.date < today ? 'past' : '', s.date === today ? 'today' : '', s.no > 1 && (s.no - 1) % PER_PAGE === 0 ? 'page-break' : ''].join(' ');
          const warn = HOLIDAYS[s.date] ? `<span class="warn">${HOLIDAYS[s.date]}</span>`
                     : !slot && perWeek ? '<span class="warn">시간표에 없는 요일</span>' : '';
          const over = cap && s.no > cap ? '<span class="warn">양식 칸 초과</span>' : '';
          return `<li class="${cls}" data-no="${s.no}">
            <span class="no">${s.no}차시</span>
            <input type="date" value="${s.date}" aria-label="${s.no}차시 날짜">
            <span class="desc">${WEEK[parseDate(s.date).getDay()]}요일${slot ? ' · ' + slotLabel(slot) : ''} ${warn}${over}${marksOf(s.no)}</span>
            <button class="link-btn" data-act="del">삭제</button>
          </li>`;
        }).join('')}
      </ul>
    </div>
  </div>`;

  main.querySelectorAll('.subtabs button').forEach(b => b.onclick = () => { sessCourse = b.dataset.cid; sessScroll = true; render(); });

  // 시간표 편집: 바꾸는 즉시 이 과목의 직접 입력 시간표로 저장
  const saveSlots = list => {
    data.timetable = data.timetable || {};
    data.timetable[course.id] = list.sort((a, b) => a.d - b.d || toMin(a.s) - toMin(b.s) || (a.p || 0) - (b.p || 0));
    save();
    render();
  };
  const editable = () => slots.map(t => ({ ...t }));
  main.querySelectorAll('.tt-list [data-f]').forEach(inp => inp.onchange = () => {
    const list = editable();
    const t = list[Number(inp.closest('li').dataset.i)];
    const f = inp.dataset.f;
    if (f === 'd') t.d = Number(inp.value);
    if (f === 'p') t.p = inp.value ? Number(inp.value) : null;
    if (f === 's') {
      t.s = inp.value;
      if (inp.value && (!t.e || toMin(t.e) <= toMin(inp.value))) {   // 종료 시간이 비었으면 50분 수업으로 채움
        const m = toMin(inp.value) + 50;
        t.e = `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
      }
    }
    if (f === 'e') t.e = inp.value;
    saveSlots(list);
  });
  main.querySelectorAll('.tt-list button[data-act=tt-del]').forEach(b => b.onclick = () => {
    saveSlots(editable().filter((_, i) => i !== Number(b.closest('li').dataset.i)));
  });
  $('ttAdd').onclick = () => {
    const last = slots.at(-1);
    saveSlots([...editable(), { d: last ? last.d : 1, p: null, s: '', e: '' }]);
  };
  if ($('ttGuess')) $('ttGuess').onclick = () => {
    // 요일별로 하루에 가장 많이 들어간 차시 수만큼 칸을 만든다 (시간은 비워 둠)
    const perDay = {};
    course.sessions.forEach(x => { perDay[x.date] = (perDay[x.date] || 0) + 1; });
    const perDow = {};
    Object.entries(perDay).forEach(([d, n]) => { const w = parseDate(d).getDay(); perDow[w] = Math.max(perDow[w] || 0, n); });
    const guessed = Object.entries(perDow).flatMap(([w, n]) => Array.from({ length: n }, () => ({ d: Number(w), p: null, s: '', e: '' })));
    if (slots.length && !confirm('지금 시간표를 기존 차시 날짜로 추정한 요일로 바꿀까요?')) return;
    saveSlots(guessed);
    toast(`요일을 채웠습니다: ${Object.entries(perDow).map(([w, n]) => `${WEEK[w]} ${n}차시`).join(', ')}. 시간을 입력하세요.`);
  };
  if ($('ttReset')) $('ttReset').onclick = () => {
    delete data.timetable[course.id];
    save();
    render();
  };
  $('autoAdd').onclick = () => {
    const n = Math.max(1, Math.min(60, Number($('autoCount').value) || 1));
    const dates = autoDates(course, n);
    rebuildSessions(course, [...currentList(course), ...dates.map(date => ({ date, old: null }))]);
    toast(`${dates.length}개 차시를 추가했습니다 (${shortDate(dates[0])}~${shortDate(dates.at(-1))}).`);
    render();
    main.querySelector('.sess-list li:last-child')?.scrollIntoView({ block: 'center' });
  };
  $('manualAdd').onclick = () => {
    const date = $('manualDate').value;
    if (!date) return;
    rebuildSessions(course, [...currentList(course), { date, old: null }]);
    const no = course.sessions.filter(s => s.date <= date).at(-1).no;
    toast(`${fmtDate(date)} ${no}차시를 추가했습니다.`);
    render();
    main.querySelector(`.sess-list li[data-no="${no}"]`)?.scrollIntoView({ block: 'center' });
  };
  main.querySelectorAll('.sess-list input[type=date]').forEach(inp => inp.onchange = () => {
    const no = Number(inp.closest('li').dataset.no);
    if (!inp.value) { render(); return; }
    rebuildSessions(course, currentList(course).map(x => x.old === no ? { ...x, date: inp.value } : x));
    toast(`${fmtDate(inp.value)}(으)로 바꿨습니다.`);
    render();
  });
  main.querySelectorAll('.sess-list button[data-act=del]').forEach(b => b.onclick = () => {
    const no = Number(b.closest('li').dataset.no);
    const t = tally(course, no);
    const n = t.absent + t.pending + t.excused;
    const s = course.sessions[no - 1];
    if (!confirm(`${no}차시 (${fmtDate(s.date)})를 삭제할까요?` + (n ? `\n이 차시의 출결 기록 ${n}건도 함께 삭제됩니다.` : '') + '\n뒤 차시들의 번호가 하나씩 당겨집니다.')) return;
    rebuildSessions(course, currentList(course).filter(x => x.old !== no));
    toast(`${no}차시를 삭제했습니다.`);
    render();
  });

  if (sessScroll) {   // 탭·과목을 바꿨을 때만 오늘 이후 첫 차시로 스크롤
    sessScroll = false;
    main.querySelector('.sess-list li:not(.past)')?.scrollIntoView({ block: 'center' });
  }
}

/* ---------- 인정결석 공문 관리 ----------
   같은 과목·같은 학생의 인정결석을 한 묶음으로 보여 준다(공문 1건이 여러 날을 다루는 경우가 많음). */
function splitKey(k) { const p = k.split('|'); const sid = p.pop(); const no = Number(p.pop()); return { cid: p.join('|'), no, sid }; }

function docGroups(status) {
  const groups = new Map();
  for (const [k, v] of Object.entries(data.marks)) {
    if (v !== status) continue;
    const { cid, no, sid } = splitKey(k);
    const course = data.courses.find(c => c.id === cid);
    const student = course?.students.find(s => s.id === sid);
    const session = course?.sessions.find(s => s.no === no);
    if (!student || !session) continue;
    const gk = `${cid}|${sid}`;
    if (!groups.has(gk)) groups.set(gk, { gk, course, student, items: [] });
    groups.get(gk).items.push({ k, session, doc: data.docs[k] });
  }
  const list = [...groups.values()];
  list.forEach(g => g.items.sort((a, b) => a.session.no - b.session.no));
  if (status === 'pending') list.sort((a, b) => a.items[0].session.date.localeCompare(b.items[0].session.date));
  else list.sort((a, b) => b.items.at(-1).session.date.localeCompare(a.items.at(-1).session.date));
  return list;
}

function daysBetween(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 864e5); }

function renderDocs() {
  const main = $('main');
  main.className = '';
  const pending = docGroups('pending');
  const excused = docGroups('excused');
  const count = gs => gs.reduce((n, g) => n + g.items.length, 0);
  const groups = docsTab === 'pending' ? pending : excused;
  const today = todayStr();

  main.innerHTML = `<div class="docs">
    <div class="subtabs">
      <button data-tab="pending" class="${docsTab === 'pending' ? 'active' : ''}">공문 대기 ${count(pending)}</button>
      <button data-tab="excused" class="${docsTab === 'excused' ? 'active' : ''}">확정 ${count(excused)}</button>
    </div>
    ${!groups.length ? `<div class="card empty"><b>${docsTab === 'pending' ? '공문을 기다리는 인정결석이 없습니다' : '확정된 인정결석이 없습니다'}</b>
      ${docsTab === 'pending' ? '수업 화면에서 학생을 <b style="display:inline;font-size:inherit">인정결석(대기)</b>로 표시하면 여기에 모입니다.' : ''}</div>` : ''}
    ${groups.map(g => `<div class="card doc-group" data-gk="${esc(g.gk)}">
      <div class="doc-head">
        <b>${esc(g.student.name)}</b>
        <span class="sub">${esc(g.student.school)}${g.student.sid ? ' · ' + esc(g.student.sid) : ''}</span>
        <span class="course">${esc(g.course.title)} · ${g.items.length}차시</span>
      </div>
      <ul class="doc-rows">
        ${g.items.map(it => docsTab === 'pending'
          ? `<li data-k="${esc(it.k)}">
              <label><input type="checkbox" checked>
                <span class="when">${fmtDate(it.session.date)} · ${it.session.no}차시</span>
                <span class="elapsed">${daysBetween(it.session.date, today) > 0 ? daysBetween(it.session.date, today) + '일 경과' : ''}</span></label>
              <button class="link-btn" data-act="absent">결석으로 변경</button>
            </li>`
          : `<li data-k="${esc(it.k)}">
              <span class="when">${fmtDate(it.session.date)} · ${it.session.no}차시</span>
              <span class="info">${it.doc?.received ? '공문 ' + fmtDate(it.doc.received) + ' 접수' : '접수일 미기록'}${it.doc?.memo ? ' · ' + esc(it.doc.memo) : ''}</span>
              <button class="link-btn" data-act="pending">대기로 되돌리기</button>
            </li>`).join('')}
      </ul>
      ${docsTab === 'pending' ? `<div class="doc-foot">
        <label>공문 접수일 <input type="date" class="received" value="${today}"></label>
        <input class="memo" placeholder="메모 (공문 번호, 사유 등)">
        <button class="primary" data-act="confirm">선택 차시 확정</button>
      </div>` : ''}
    </div>`).join('')}
  </div>`;

  main.querySelectorAll('.subtabs button').forEach(b => b.onclick = () => { docsTab = b.dataset.tab; render(); });
  main.querySelectorAll('.doc-rows button[data-act]').forEach(b => b.onclick = () => {
    const k = b.closest('li').dataset.k;
    const { cid, no, sid } = splitKey(k);
    setMark(cid, no, sid, b.dataset.act);
    toast(b.dataset.act === 'absent' ? '결석으로 변경했습니다.' : '공문 대기로 되돌렸습니다.');
    render();
  });
  main.querySelectorAll('button[data-act="confirm"]').forEach(b => b.onclick = () => {
    const box = b.closest('.doc-group');
    const keys = [...box.querySelectorAll('.doc-rows li')].filter(li => li.querySelector('input[type=checkbox]').checked).map(li => li.dataset.k);
    if (!keys.length) { toast('확정할 차시를 선택하세요.'); return; }
    const received = box.querySelector('.received').value || todayStr();
    const memo = box.querySelector('.memo').value.trim();
    keys.forEach(k => { data.marks[k] = 'excused'; data.docs[k] = { received, memo }; });
    save();
    toast(`${keys.length}개 차시를 인정결석으로 확정했습니다.`);
    render();
  });
}

function tick() {
  const d = new Date();
  $('clock').textContent = `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ---------- 출석부 엑셀 구조 읽기 ----------
   시트 = 과목. 페이지마다 '연번' 머리글 행, 바로 아래 행에 차시 날짜(F~V열), 그 아래 학생 행.
   차시 날짜는 앞 차시보다 이른 날짜가 나오면(양식에 남은 옛 날짜) 거기서 멈춘다.
   가져오기와 내보내기가 같은 규칙을 써야 차시 번호와 셀 위치가 일치한다. */
function scanSheet(ws) {
  if (!ws['!ref']) return null;
  const range = XLSX.utils.decode_range(ws['!ref']);
  const cell = (r, c) => { const x = ws[XLSX.utils.encode_cell({ r, c })]; return x && x.t !== 'e' ? x.v : null; };
  const str = (r, c) => { const v = cell(r, c); return v == null ? '' : String(v).trim(); };

  const headers = [];
  let info = null;
  for (let r = range.s.r; r <= range.e.r; r++) {
    if (str(r, 1) === '연번') headers.push(r);
    if (!info && str(r, 1) === '수업') info = { title: str(r + 1, 1), credits: str(r + 1, 3), teacher: str(r + 1, 5) };
  }
  if (!headers.length || !info) return null;

  // 페이지별 학생 행 (이름은 2페이지부터 수식 결과값)
  const pages = headers.map(h => {
    const rows = [];
    for (let r = h + 2; r <= range.e.r; r++) {
      if (typeof cell(r, 1) !== 'number') break;
      const name = str(r, 4);
      if (name) rows.push({ r, name });
    }
    return { h, rows };
  });

  const students = pages[0].rows.map((x, i) => ({ id: 's' + (i + 1), seq: i + 1, school: str(x.r, 2), sid: str(x.r, 3), name: x.name }));

  // 차시 n은 (n-1)/17 번째 페이지의 F열부터 순서대로. 빈칸이나 앞보다 이른 날짜에서 멈춘다.
  const sessions = [];
  let last = '';
  outer:
  for (let p = 0; p < pages.length; p++) {
    for (let c = FIRST_COL; c < FIRST_COL + PER_PAGE; c++) {
      const v = cell(pages[p].h + 1, c);
      if (typeof v !== 'number' || v < 40000) break outer;
      const d = XLSX.SSF.parse_date_code(v);
      const date = `${d.y}-${pad(d.m)}-${pad(d.d)}`;
      if (date < last) break outer;
      last = date;
      sessions.push({ no: sessions.length + 1, date, page: p, col: c });
    }
  }
  const yellow = (r, c) => {
    const st = ws[XLSX.utils.encode_cell({ r, c })]?.s;
    return !!st && st.patternType === 'solid' && /^(FF)?FFFF00$/i.test(st.fgColor?.rgb || '');
  };
  return { info, pages, students, sessions, str, yellow, note: str(headers[0] + 1, 23) };
}

/* 기존 기호: X/x → 결석, ◎ → 인정결석(확정), 노란 배경 ◎ → 인정결석(대기). 그 외 기호는 무시(내보낼 때도 건드리지 않음). */
function importWorkbook(buf, fileName) {
  const wb = XLSX.read(buf, { type: 'array', cellStyles: true });
  const courses = [];
  const marks = {};
  const warnings = [];

  for (const sheetName of wb.SheetNames) {
    if (sheetName === '양식') continue;
    const sc = scanSheet(wb.Sheets[sheetName]);
    if (!sc) continue;
    for (const s of sc.sessions) {
      for (const row of sc.pages[s.page].rows) {
        const st = sc.students.find(x => x.name === row.name);
        if (!st) continue;
        const m = sc.str(row.r, s.col);
        if (m === 'X' || m === 'x') marks[`${sheetName}|${s.no}|${st.id}`] = 'absent';
        else if (m === '◎') marks[`${sheetName}|${s.no}|${st.id}`] = sc.yellow(row.r, s.col) ? 'pending' : 'excused';
      }
    }
    courses.push({ id: sheetName, title: sc.info.title, credits: sc.info.credits, teacher: sc.info.teacher,
                   note: sc.note, students: sc.students, sessions: sc.sessions.map(({ no, date }) => ({ no, date })),
                   capacity: sc.pages.length * PER_PAGE });
    if (!getSlots(sheetName).length) warnings.push(sheetName);
  }

  // 수업명이 겹치면(예: 자산관리 시트의 수업명이 '사회문화') 시트 이름으로 구분
  courses.forEach(c => {
    if (courses.filter(o => o.title === c.title).length > 1) c.title = c.id.replace(/\(.*\)/, '');
  });

  if (!courses.length) throw new Error('출석부 형식의 시트를 찾지 못했습니다.');
  const docs = {};
  Object.entries(marks).forEach(([k, v]) => { if (v === 'excused') docs[k] = { received: null, memo: '출석부 엑셀에서 가져옴' }; });
  const timetable = data?.timetable || {};   // 직접 입력한 시간표는 다시 가져와도 유지
  data = { importedAt: new Date().toISOString(), fileName, courses, marks, docs, timetable };
  save();
  saveTemplate(buf, fileName);
  return { courses, warnings };
}

/* ---------- 원본 양식 보관 ----------
   내보내기는 가져온 원본 파일을 양식으로 삼아 출결 칸만 바꾼다. */
function saveTemplate(buf, fileName) {
  const bytes = new Uint8Array(buf);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  try { localStorage.setItem(TEMPLATE_KEY, JSON.stringify({ fileName, b64: btoa(bin) })); return true; }
  catch (e) { return false; }
}
function loadTemplate() {
  try {
    const t = JSON.parse(localStorage.getItem(TEMPLATE_KEY));
    const bin = atob(t.b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return { fileName: t.fileName, buf: bytes.buffer };
  } catch (e) { return null; }
}

/* ---------- 출석부 엑셀 내보내기 ----------
   xlsx(zip) 안의 시트 XML에서 출결 칸의 값과 채우기만 바꾼다. 서식·수식·인쇄 설정·그림은 원본 그대로.
   결석 X / 인정결석(확정) ◎ / 인정결석(대기) ◎ + 노란 배경 / 출석 빈칸 */
const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const NS_R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const XML_HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n';
const EXPORT_SYMBOL = { absent: 'X', pending: '◎', excused: '◎', present: null };

function loadScript(src) {
  return new Promise((ok, fail) => {
    const s = Object.assign(document.createElement('script'), { src, onload: ok, onerror: () => fail(new Error('라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.')) });
    document.head.appendChild(s);
  });
}

async function exportWorkbook(template) {
  if (!window.JSZip) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  const wb = XLSX.read(template, { type: 'array' });
  const zip = await JSZip.loadAsync(template);
  const parse = async path => new DOMParser().parseFromString(await zip.file(path).async('string'), 'application/xml');
  const write = (path, doc) => zip.file(path, XML_HEAD + new XMLSerializer().serializeToString(doc).replace(/^<\?xml[^>]*\?>\s*/, ''), { createFolders: false });

  // 시트 이름 → 시트 XML 경로
  const wbDoc = await parse('xl/workbook.xml');
  const rels = await parse('xl/_rels/workbook.xml.rels');
  const target = {};
  for (const r of rels.getElementsByTagName('Relationship')) target[r.getAttribute('Id')] = r.getAttribute('Target');
  const sheetPath = {};
  for (const s of wbDoc.getElementsByTagNameNS(NS, 'sheet')) {
    const t = target[s.getAttributeNS(NS_R, 'id')];
    sheetPath[s.getAttribute('name')] = t.startsWith('/') ? t.slice(1) : 'xl/' + t;
  }

  // 스타일: 기존 칸 스타일을 복제해 채우기만 바꾼다
  const styles = await parse('xl/styles.xml');
  const fillsEl = styles.getElementsByTagNameNS(NS, 'fills')[0];
  const xfsEl = styles.getElementsByTagNameNS(NS, 'cellXfs')[0];
  const fills = [...fillsEl.getElementsByTagNameNS(NS, 'fill')];
  const isYellow = f => {
    const p = f.getElementsByTagNameNS(NS, 'patternFill')[0];
    const fg = p && p.getElementsByTagNameNS(NS, 'fgColor')[0];
    return p && p.getAttribute('patternType') === 'solid' && fg && (fg.getAttribute('rgb') || '').toUpperCase() === 'FFFFFF00';
  };
  let yellowId = fills.findIndex(isYellow);
  if (yellowId < 0) {
    const f = new DOMParser().parseFromString(`<fill xmlns="${NS}"><patternFill patternType="solid"><fgColor rgb="FFFFFF00"/><bgColor indexed="64"/></patternFill></fill>`, 'application/xml').documentElement;
    fillsEl.appendChild(styles.importNode(f, true));
    yellowId = fills.length;
    fillsEl.setAttribute('count', yellowId + 1);
  }
  const xfCache = {};
  function styleFor(s, yellow) {
    const xfs = xfsEl.getElementsByTagNameNS(NS, 'xf');
    const xf = xfs[s] || xfs[0];
    const cur = Number(xf.getAttribute('fillId') || 0);
    const want = yellow ? yellowId : (cur === yellowId ? 0 : cur);
    if (want === cur) return s;
    const ck = s + ':' + want;
    if (xfCache[ck] == null) {
      const clone = xf.cloneNode(true);
      clone.setAttribute('fillId', want);
      clone.setAttribute('applyFill', '1');
      xfsEl.appendChild(clone);
      xfCache[ck] = xfs.length - 1;
      xfsEl.setAttribute('count', xfs.length);
    }
    return xfCache[ck];
  }

  const overflow = [];
  for (const course of data.courses) {
    const path = sheetPath[course.id];
    const sc = path && scanSheet(wb.Sheets[course.id]);
    if (!sc) continue;
    const doc = await parse(path);
    const sheetData = doc.getElementsByTagNameNS(NS, 'sheetData')[0];
    const rowEls = {};
    for (const r of sheetData.getElementsByTagNameNS(NS, 'row')) rowEls[r.getAttribute('r')] = r;

    // 양식의 모든 차시 칸을 앱의 차시 순서대로 채운다. 차시가 없는 칸은 날짜와 출결 기호를 비운다.
    for (let p = 0; p < sc.pages.length; p++) {
      for (let c = FIRST_COL; c < FIRST_COL + PER_PAGE; c++) {
        const s = course.sessions[p * PER_PAGE + (c - FIRST_COL)];
        setCell(doc, sheetData, rowEls, sc.pages[p].h + 2, c, s ? dateSerial(s.date) : null, x => x);
        for (const row of sc.pages[p].rows) {
          const cur = sc.str(row.r, c);
          const st = course.students.find(x => x.name === row.name);
          const m = s && st ? markOf(course.id, s.no, st.id) : 'present';
          if (m === 'present' && !['', 'X', 'x', '◎'].includes(cur)) continue;  // '확' 같은 메모 기호는 그대로 둔다
          setCell(doc, sheetData, rowEls, row.r + 1, c, EXPORT_SYMBOL[m], x => styleFor(x, m === 'pending'));
        }
      }
    }
    const cap = sc.pages.length * PER_PAGE;
    if (course.sessions.length > cap) overflow.push(`${course.title} ${course.sessions.length}차시(양식 ${cap}칸)`);
    write(path, doc);
  }
  write('xl/styles.xml', styles);
  const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  return { blob, overflow };
}

function dateSerial(s) { const [y, m, d] = s.split('-').map(Number); return (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5; }

/* value: 문자열(inline string) · 숫자 · null(비움). restyle: 기존 스타일 번호 → 새 스타일 번호 */
function setCell(doc, sheetData, rowEls, r1, c0, value, restyle) {
  const ref = XLSX.utils.encode_col(c0) + r1;
  let row = rowEls[r1];
  if (!row) {
    row = doc.createElementNS(NS, 'row');
    row.setAttribute('r', r1);
    const after = [...sheetData.getElementsByTagNameNS(NS, 'row')].find(x => Number(x.getAttribute('r')) > r1);
    sheetData.insertBefore(row, after || null);
    rowEls[r1] = row;
  }
  let c = [...row.getElementsByTagNameNS(NS, 'c')].find(x => x.getAttribute('r') === ref);
  if (!c) {
    c = doc.createElementNS(NS, 'c');
    c.setAttribute('r', ref);
    const after = [...row.getElementsByTagNameNS(NS, 'c')].find(x => XLSX.utils.decode_cell(x.getAttribute('r')).c > c0);
    row.insertBefore(c, after || null);
  }
  while (c.firstChild) c.removeChild(c.firstChild);
  c.removeAttribute('t');
  c.setAttribute('s', restyle(Number(c.getAttribute('s') || 0)));
  if (typeof value === 'number') {
    const v = doc.createElementNS(NS, 'v');
    v.textContent = String(value);
    c.appendChild(v);
  } else if (value) {
    c.setAttribute('t', 'inlineStr');
    const is = doc.createElementNS(NS, 'is');
    const t = doc.createElementNS(NS, 't');
    t.textContent = value;
    is.appendChild(t);
    c.appendChild(is);
  }
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function runExport(template) {
  try {
    toast('엑셀 파일을 만드는 중…');
    const { blob, overflow } = await exportWorkbook(template.buf);
    if (overflow.length) alert('출석부 양식의 차시 칸이 모자라 일부 차시를 내보내지 못했습니다.\n' + overflow.join('\n') + '\n\n엑셀 양식에 페이지를 추가한 뒤 메뉴의 「내보내기 양식 파일 바꾸기」로 그 파일을 지정해 주세요.');
    const base = (template.fileName || '출석부.xlsx').replace(/\.xlsx?$/i, '');
    downloadBlob(blob, `${base}_${todayStr().replace(/-/g, '')}.xlsx`);
    const n = Object.values(data.marks).filter(v => v === 'pending').length;
    toast('출석부를 내보냈습니다.' + (n ? ` 공문 대기 ${n}건은 노란 배경 ◎로 표시됩니다.` : ''));
  } catch (err) {
    console.error(err);
    toast(err.message || '내보내기에 실패했습니다.');
  }
}

/* ---------- 이벤트 ---------- */
$('fileInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (data && !confirm('기존 데이터를 새 출석부로 교체할까요?')) return;
  try {
    const { courses, warnings } = importWorkbook(await file.arrayBuffer(), file.name);
    const students = courses.reduce((n, c) => n + c.students.length, 0);
    toast(`${courses.length}개 과목, 수강생 ${students}명을 불러왔습니다.` + (warnings.length ? ` 시간표가 없는 과목(${warnings.join(', ')})은 「차시 관리」에서 입력하세요.` : ''));
    viewDate = todayStr(); selectedKey = null; view = 'classes';
    render();
  } catch (err) {
    toast(err.message || '파일을 읽지 못했습니다.');
  }
});

$('menuBtn').onclick = e => { e.stopPropagation(); $('menu').classList.toggle('open'); };
document.addEventListener('click', () => $('menu').classList.remove('open'));
$('menuImport').onclick = () => $('fileInput').click();
$('menuExport').onclick = () => {
  if (!data) { toast('먼저 출석부를 불러오세요.'); return; }
  const t = loadTemplate();
  if (t) runExport(t);
  else { toast('양식으로 쓸 원본 출석부 파일을 선택하세요.'); $('templateInput').click(); }
};
let templateThenExport = true;
$('menuTemplate').onclick = () => { templateThenExport = false; $('templateInput').click(); };
$('templateInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const buf = await file.arrayBuffer();
  saveTemplate(buf, file.name);
  if (templateThenExport) runExport({ fileName: file.name, buf });
  else toast(`내보내기 양식을 「${file.name}」로 바꿨습니다.`);
  templateThenExport = true;
});
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  view = b.dataset.view;
  if (view === 'docs') docsTab = 'pending';
  if (view === 'sessions') { sessCourse = sessCourse || classesOn(viewDate)[0]?.course.id; sessScroll = true; }
  window.scrollTo(0, 0);
  render();
});
$('menuReset').onclick = () => {
  if (!confirm('모든 과목과 출결 기록을 지울까요? 되돌릴 수 없습니다.')) return;
  data = null;
  try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(TEMPLATE_KEY); } catch (e) {}
  render();
};
$('prevDay').onclick = () => { viewDate = addDays(viewDate, -1); selectedKey = null; $('main').classList.remove('show-roster'); render(); };
$('nextDay').onclick = () => { viewDate = addDays(viewDate, 1); selectedKey = null; $('main').classList.remove('show-roster'); render(); };
$('todayBtn').onclick = () => { viewDate = todayStr(); selectedKey = null; render(); };

viewDate = todayStr();
tick();
render();
setInterval(() => {
  tick();
  if (data && view === 'classes' && viewDate === todayStr() && !document.querySelector('.menu.open')) render(); // 진행 중 표시 갱신
}, 60000);
</script>
</body>
</html>
