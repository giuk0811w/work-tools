<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출석 확인</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --accent: #2f6fed; --present: #1f9d55; --late: #d98b00; --absent: #d64545; --early: #7c5cd6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b; --card: #1d2027; --text: #e6e8ec; --muted: #9aa1ad; --line: #2e323b;
      --accent: #5b8ff5; --present: #3cc07a; --late: #f0a92a; --absent: #ef6b6b; --early: #a18af0;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         background: var(--bg); color: var(--text); font-size: 15px; }
  header { padding: 16px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { margin: 0 0 12px; font-size: 20px; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav button { border: 1px solid var(--line); background: transparent; color: var(--text);
               padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  section { display: none; }
  section.active { display: block; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  label { font-size: 13px; color: var(--muted); }
  input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                            border-radius: 8px; padding: 8px 10px; }
  textarea { width: 100%; min-height: 90px; }
  button.btn { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text);
               border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--absent); }
  .summary { display: flex; gap: 12px; flex-wrap: wrap; font-size: 14px; margin: 12px 0 4px; }
  .summary b { font-variant-numeric: tabular-nums; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line); }
  .list li:first-child { border-top: 0; }
  .name { flex: 1 1 120px; font-weight: 600; }
  .status { display: flex; gap: 4px; }
  .status button { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; cursor: pointer;
                   border: 1px solid var(--line); background: transparent; color: var(--muted); }
  .status button.on[data-s="present"] { background: var(--present); border-color: var(--present); color: #fff; }
  .status button.on[data-s="late"]    { background: var(--late);    border-color: var(--late);    color: #fff; }
  .status button.on[data-s="absent"]  { background: var(--absent);  border-color: var(--absent);  color: #fff; }
  .status button.on[data-s="early"]   { background: var(--early);   border-color: var(--early);   color: #fff; }
  .note { flex: 1 1 100%; font-size: 13px; padding: 6px 8px; }
  .empty { color: var(--muted); padding: 12px 0; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border-bottom: 1px solid var(--line); padding: 8px; text-align: center; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  td.rate { font-weight: 600; }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg);
           padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (min-width: 640px) { .note { flex: 1 1 180px; } }
</style>
</head>
<body>
<header>
  <h1>출석 확인</h1>
  <nav>
    <button data-tab="check" class="active">출석 체크</button>
    <button data-tab="stats">통계</button>
    <button data-tab="manage">반·학생 관리</button>
    <button data-tab="data">데이터</button>
  </nav>
</header>

<main>
  <!-- 출석 체크 -->
  <section id="check" class="active">
    <div class="card">
      <div class="row">
        <label>반 <select id="checkClass"></select></label>
        <label>날짜 <input type="date" id="checkDate"></label>
        <button class="btn" id="allPresent">전원 출석</button>
      </div>
      <div class="summary" id="checkSummary"></div>
    </div>
    <div class="card"><ul class="list" id="checkList"></ul></div>
  </section>

  <!-- 통계 -->
  <section id="stats">
    <div class="card">
      <div class="row">
        <label>반 <select id="statsClass"></select></label>
        <label>기간 <input type="date" id="statsFrom"></label>
        <label>~ <input type="date" id="statsTo"></label>
        <button class="btn" id="exportCsv">CSV 내보내기</button>
      </div>
      <p class="hint">출석률 = (출석 + 지각 + 조퇴) ÷ 기록된 수업일 수</p>
    </div>
    <div class="card table-wrap"><table id="statsTable"></table></div>
  </section>

  <!-- 반·학생 관리 -->
  <section id="manage">
    <div class="card">
      <div class="row">
        <input id="newClassName" placeholder="새 반 이름">
        <button class="btn primary" id="addClass">반 추가</button>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <label>반 <select id="manageClass"></select></label>
        <button class="btn" id="renameClass">이름 변경</button>
        <button class="btn danger" id="deleteClass">반 삭제</button>
      </div>
      <p class="hint">학생 이름을 한 줄에 한 명씩 입력하세요. 엑셀에서 이름 열을 복사해 붙여넣어도 됩니다.</p>
      <textarea id="bulkStudents" placeholder="홍길동&#10;김철수&#10;이영희"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn primary" id="addStudents">학생 추가</button></div>
    </div>
    <div class="card"><ul class="list" id="studentList"></ul></div>
  </section>

  <!-- 데이터 -->
  <section id="data">
    <div class="card">
      <p style="margin-top:0">데이터는 이 브라우저에만 저장됩니다. 다른 기기로 옮기거나 백업하려면 파일로 내보내세요.</p>
      <div class="row">
        <button class="btn primary" id="backup">백업 파일 저장 (JSON)</button>
        <label class="btn" style="color:var(--text)">백업 불러오기<input type="file" id="restore" accept="application/json" hidden></label>
      </div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const STORE_KEY = 'attendance-app-v1';
const STATUSES = [
  { key: 'present', label: '출석' },
  { key: 'late',    label: '지각' },
  { key: 'early',   label: '조퇴' },
  { key: 'absent',  label: '결석' },
];
const LABEL = Object.fromEntries(STATUSES.map(s => [s.key, s.label]));

// data = { classes: [{id, name, students: [{id, name}]}], records: { "classId|YYYY-MM-DD": { studentId: {s, note} } } }
let data = load();

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { classes: [], records: {} };
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
  catch (e) { toast('저장에 실패했습니다. 백업 파일을 저장해 주세요.'); }
}

const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const today = () => {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const findClass = id => data.classes.find(c => c.id === id);

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ---------- 탭 ----------
document.querySelectorAll('nav button').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('active', s.id === btn.dataset.tab));
  render();
}));

function fillClassSelect(sel) {
  const prev = sel.value;
  sel.innerHTML = data.classes.length
    ? data.classes.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')
    : '<option value="">(반 없음)</option>';
  if (findClass(prev)) sel.value = prev;
}

// ---------- 출석 체크 ----------
function recordKey() { return $('checkClass').value + '|' + $('checkDate').value; }

function renderCheck() {
  fillClassSelect($('checkClass'));
  const cls = findClass($('checkClass').value);
  const list = $('checkList');
  if (!cls) {
    list.innerHTML = '<li class="empty">먼저 "반·학생 관리"에서 반과 학생을 추가하세요.</li>';
    $('checkSummary').innerHTML = '';
    return;
  }
  if (!cls.students.length) {
    list.innerHTML = '<li class="empty">이 반에 학생이 없습니다.</li>';
    $('checkSummary').innerHTML = '';
    return;
  }
  const rec = data.records[recordKey()] || {};
  list.innerHTML = cls.students.map(st => {
    const r = rec[st.id] || {};
    return `<li data-id="${st.id}">
      <span class="name">${esc(st.name)}</span>
      <span class="status">${STATUSES.map(s =>
        `<button data-s="${s.key}" class="${r.s === s.key ? 'on' : ''}">${s.label}</button>`).join('')}</span>
      <input class="note" placeholder="메모 (사유 등)" value="${esc(r.note || '')}">
    </li>`;
  }).join('');
  renderSummary(cls, rec);
}

function renderSummary(cls, rec) {
  const counts = { present: 0, late: 0, early: 0, absent: 0 };
  let unmarked = 0;
  cls.students.forEach(st => { const s = rec[st.id]?.s; s ? counts[s]++ : unmarked++; });
  $('checkSummary').innerHTML =
    STATUSES.map(s => `<span>${s.label} <b>${counts[s.key]}</b></span>`).join('') +
    `<span style="color:var(--muted)">미체크 <b>${unmarked}</b></span>`;
}

function setRecord(studentId, patch) {
  const key = recordKey();
  const rec = data.records[key] = data.records[key] || {};
  const r = rec[studentId] = { ...rec[studentId], ...patch };
  if (!r.s && !r.note) delete rec[studentId];
  if (!Object.keys(rec).length) delete data.records[key];
  save();
}

$('checkList').addEventListener('click', e => {
  const btn = e.target.closest('.status button');
  if (!btn) return;
  const id = btn.closest('li').dataset.id;
  const cur = data.records[recordKey()]?.[id]?.s;
  setRecord(id, { s: cur === btn.dataset.s ? undefined : btn.dataset.s });
  renderCheck();
});
$('checkList').addEventListener('change', e => {
  if (!e.target.classList.contains('note')) return;
  setRecord(e.target.closest('li').dataset.id, { note: e.target.value.trim() || undefined });
});
$('checkClass').addEventListener('change', renderCheck);
$('checkDate').addEventListener('change', renderCheck);
$('allPresent').addEventListener('click', () => {
  const cls = findClass($('checkClass').value);
  if (!cls) return;
  const rec = data.records[recordKey()] || {};
  cls.students.forEach(st => { if (!rec[st.id]?.s) setRecord(st.id, { s: 'present' }); });
  renderCheck();
  toast('미체크 학생을 모두 출석 처리했습니다.');
});

// ---------- 통계 ----------
function computeStats() {
  const cls = findClass($('statsClass').value);
  if (!cls) return null;
  const from = $('statsFrom').value, to = $('statsTo').value;
  const days = Object.keys(data.records)
    .filter(k => k.startsWith(cls.id + '|'))
    .map(k => k.slice(cls.id.length + 1))
    .filter(d => (!from || d >= from) && (!to || d <= to))
    .sort();
  const rows = cls.students.map(st => {
    const c = { present: 0, late: 0, early: 0, absent: 0 };
    days.forEach(d => { const s = data.records[cls.id + '|' + d][st.id]?.s; if (s) c[s]++; });
    const total = c.present + c.late + c.early + c.absent;
    const rate = total ? Math.round((total - c.absent) / total * 1000) / 10 : null;
    return { name: st.name, ...c, total, rate };
  });
  return { cls, days, rows };
}

function renderStats() {
  fillClassSelect($('statsClass'));
  const st = computeStats();
  const table = $('statsTable');
  if (!st) { table.innerHTML = '<tr><td class="empty">반이 없습니다.</td></tr>'; return; }
  table.innerHTML =
    `<tr><th>이름</th>${STATUSES.map(s => `<th>${s.label}</th>`).join('')}<th>출석률</th></tr>` +
    (st.rows.length ? st.rows.map(r => `<tr><td>${esc(r.name)}</td>${STATUSES.map(s => `<td>${r[s.key]}</td>`).join('')}
      <td class="rate">${r.rate === null ? '-' : r.rate + '%'}</td></tr>`).join('')
      : '<tr><td class="empty" colspan="6">학생이 없습니다.</td></tr>') +
    `<tr><td colspan="6" style="color:var(--muted);text-align:left">기록된 수업일 ${st.days.length}일</td></tr>`;
}
['statsClass', 'statsFrom', 'statsTo'].forEach(id => $(id).addEventListener('change', renderStats));

function download(name, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const csvCell = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);

$('exportCsv').addEventListener('click', () => {
  const st = computeStats();
  if (!st) return;
  // 날짜별 상세 + 합계
  const header = ['이름', ...st.days, ...STATUSES.map(s => s.label), '출석률'];
  const lines = [header];
  st.cls.students.forEach((stu, i) => {
    const r = st.rows[i];
    lines.push([
      stu.name,
      ...st.days.map(d => {
        const x = data.records[st.cls.id + '|' + d][stu.id];
        return x ? (LABEL[x.s] || '') + (x.note ? ` (${x.note})` : '') : '';
      }),
      ...STATUSES.map(s => r[s.key]),
      r.rate === null ? '' : r.rate + '%',
    ]);
  });
  const csv = '﻿' + lines.map(l => l.map(csvCell).join(',')).join('\r\n'); // BOM: 엑셀 한글 깨짐 방지
  download(`출석_${st.cls.name}_${today()}.csv`, csv, 'text/csv;charset=utf-8');
});

// ---------- 반·학생 관리 ----------
function renderManage() {
  fillClassSelect($('manageClass'));
  const cls = findClass($('manageClass').value);
  const list = $('studentList');
  if (!cls) { list.innerHTML = '<li class="empty">반을 먼저 추가하세요.</li>'; return; }
  list.innerHTML = cls.students.length
    ? cls.students.map((st, i) => `<li data-id="${st.id}">
        <span class="name">${i + 1}. ${esc(st.name)}</span>
        <button class="btn" data-act="up">↑</button>
        <button class="btn" data-act="rename">이름 변경</button>
        <button class="btn danger" data-act="delete">삭제</button>
      </li>`).join('')
    : '<li class="empty">학생이 없습니다.</li>';
}

$('addClass').addEventListener('click', () => {
  const name = $('newClassName').value.trim();
  if (!name) return;
  const cls = { id: uid(), name, students: [] };
  data.classes.push(cls);
  save();
  $('newClassName').value = '';
  renderManage();
  $('manageClass').value = cls.id;
  renderManage();
  toast(`"${name}" 반을 추가했습니다.`);
});
$('newClassName').addEventListener('keydown', e => { if (e.key === 'Enter') $('addClass').click(); });
$('manageClass').addEventListener('change', renderManage);

$('renameClass').addEventListener('click', () => {
  const cls = findClass($('manageClass').value);
  if (!cls) return;
  const name = prompt('새 반 이름', cls.name);
  if (name && name.trim()) { cls.name = name.trim(); save(); renderManage(); }
});
$('deleteClass').addEventListener('click', () => {
  const cls = findClass($('manageClass').value);
  if (!cls || !confirm(`"${cls.name}" 반과 모든 출석 기록을 삭제할까요?`)) return;
  data.classes = data.classes.filter(c => c !== cls);
  Object.keys(data.records).forEach(k => { if (k.startsWith(cls.id + '|')) delete data.records[k]; });
  save();
  renderManage();
});

$('addStudents').addEventListener('click', () => {
  const cls = findClass($('manageClass').value);
  if (!cls) { toast('반을 먼저 추가하세요.'); return; }
  const names = $('bulkStudents').value.split(/\r?\n/).map(s => s.split('\t')[0].trim()).filter(Boolean);
  if (!names.length) return;
  names.forEach(name => cls.students.push({ id: uid(), name }));
  save();
  $('bulkStudents').value = '';
  renderManage();
  toast(`${names.length}명을 추가했습니다.`);
});

$('studentList').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const cls = findClass($('manageClass').value);
  const idx = cls.students.findIndex(s => s.id === btn.closest('li').dataset.id);
  const st = cls.students[idx];
  if (btn.dataset.act === 'up' && idx > 0) {
    [cls.students[idx - 1], cls.students[idx]] = [cls.students[idx], cls.students[idx - 1]];
  } else if (btn.dataset.act === 'rename') {
    const name = prompt('새 이름', st.name);
    if (!name || !name.trim()) return;
    st.name = name.trim();
  } else if (btn.dataset.act === 'delete') {
    if (!confirm(`"${st.name}" 학생을 삭제할까요? (출석 기록도 삭제됩니다)`)) return;
    cls.students.splice(idx, 1);
    Object.keys(data.records).forEach(k => {
      if (!k.startsWith(cls.id + '|')) return;
      delete data.records[k][st.id];
      if (!Object.keys(data.records[k]).length) delete data.records[k];
    });
  } else return;
  save();
  renderManage();
});

// ---------- 데이터 ----------
$('backup').addEventListener('click', () => {
  download(`출석_백업_${today()}.json`, JSON.stringify(data, null, 2), 'application/json');
});
$('restore').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const parsed = JSON.parse(await file.text());
    if (!Array.isArray(parsed.classes) || typeof parsed.records !== 'object') throw new Error();
    if (!confirm('현재 데이터를 백업 파일 내용으로 덮어쓸까요?')) return;
    data = parsed;
    save();
    render();
    toast('백업을 불러왔습니다.');
  } catch {
    toast('올바른 백업 파일이 아닙니다.');
  }
});

// ---------- 초기화 ----------
function render() {
  const tab = document.querySelector('nav button.active').dataset.tab;
  if (tab === 'check') renderCheck();
  if (tab === 'stats') renderStats();
  if (tab === 'manage') renderManage();
}

$('checkDate').value = today();
$('statsTo').value = today();
$('statsFrom').value = today().slice(0, 8) + '01';
if (!data.classes.length) {
  document.querySelector('nav button[data-tab="manage"]').click();
} else {
  render();
}
</script>
</body>
</html>
